name: Build unsigned IPA

# Manual build of an unsigned UTM.ipa (JIT/full build) for re-signing tools
# such as ESign. Uses the repo's own scripts; sysroot is built once and then
# cached by GitHub Actions. Run from the Actions tab with "Run workflow".
on:
  workflow_dispatch:
    inputs:
      scheme:
        description: 'Scheme (iOS = full/JIT, iOS-SE = no-JIT)'
        required: true
        default: 'iOS'
        type: choice
        options:
          - iOS
          - iOS-SE

env:
  BUILD_XCODE_PATH: /Applications/Xcode.app
  RUNNER_IMAGE: macos-26

jobs:
  build-sysroot:
    name: Build Sysroot
    runs-on: macos-26
    outputs:
      platform: ${{ steps.vars.outputs.platform }}
    steps:
      - name: Resolve platform
        id: vars
        run: |
          if [ "${{ inputs.scheme }}" = "iOS-SE" ]; then
            echo "platform=ios-tci" >> "$GITHUB_OUTPUT"
          else
            echo "platform=ios" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select Xcode
        run: |
          [[ "$(xcode-select -p)" == "${{ env.BUILD_XCODE_PATH }}"* ]] || sudo xcode-select -s "${{ env.BUILD_XCODE_PATH }}"
      - name: Setup Path
        run: echo "/usr/local/opt/bison/bin:/opt/homebrew/opt/bison/bin" >> "$GITHUB_PATH"
      - name: Check cache
        id: cache-sysroot
        uses: actions/cache@v4
        with:
          path: ./sysroot-${{ steps.vars.outputs.platform }}-arm64
          key: ${{ steps.vars.outputs.platform }}-arm64-${{ hashFiles('scripts/build_dependencies.sh', 'scripts/fixup.sh') }}-${{ hashFiles('patches/**') }}
      - name: Install build requirements
        if: steps.cache-sysroot.outputs.cache-hit != 'true'
        run: |
          brew uninstall cmake || true
          brew install bison pkg-config gettext glib-utils libgpg-error nasm make meson cmake
          brew install llvm spirv-llvm-translator libxcb libxrandr
          pip3 install --break-system-packages --user six pyparsing pyyaml setuptools distlib mako
          gem install --user-install xcpretty || true
          rm -f /usr/local/lib/pkgconfig/*.pc
      - name: Build sysroot
        if: steps.cache-sysroot.outputs.cache-hit != 'true'
        run: ./scripts/build_dependencies.sh -p ${{ steps.vars.outputs.platform }} -a arm64
        env:
          # limit 1 CPU for TCI builds due to memory issues
          NCPU: ${{ steps.vars.outputs.platform == 'ios-tci' && '1' || '0' }}

  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-26
    needs: build-sysroot
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Select Xcode
        run: |
          [[ "$(xcode-select -p)" == "${{ env.BUILD_XCODE_PATH }}"* ]] || sudo xcode-select -s "${{ env.BUILD_XCODE_PATH }}"
      - name: Restore sysroot
        uses: actions/cache@v4
        with:
          path: ./sysroot-${{ needs.build-sysroot.outputs.platform }}-arm64
          key: ${{ needs.build-sysroot.outputs.platform }}-arm64-${{ hashFiles('scripts/build_dependencies.sh', 'scripts/fixup.sh') }}-${{ hashFiles('patches/**') }}
          fail-on-cache-miss: true
      - name: Static checks
        run: sh Tests/Static/run_all.sh --no-sdp
      - name: Build xcarchive
        run: ./scripts/build_utm.sh -k iphoneos -s ${{ inputs.scheme }} -a arm64 -o UTM
      - name: Package unsigned IPA
        run: |
          MODE=ipa
          if [ "${{ inputs.scheme }}" = "iOS-SE" ]; then MODE=ipa-se; fi
          ./scripts/package.sh $MODE UTM.xcarchive out
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: UTM-unsigned-${{ inputs.scheme }}
          path: out/*.ipa
